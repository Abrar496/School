<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - School Server</title>
  <style>
    :root {
      --primary: #5c4b8b;
      --primary-hover: #4a3c72;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
      --success: #38a169;
      --danger: #e53e3e;
      --warning: #dd6b20;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 500px; margin: auto; }
    .card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 16px; border: 1px solid var(--border); }
    h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; text-align: center; }
    p.subtitle { font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus { border-color: var(--primary); }
    button.btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button.btn:hover { background: var(--primary-hover); }
    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { background: #fff5f5; border: 1px solid #feb2b2; color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .loading { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin: 12px 0; display: none; }
    
    /* Dashboard Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 8px 12px; border: none; background: none; font-weight: 600; color: var(--text-muted); border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    
    /* Content sections */
    .content-pane { display: none; }
    .content-pane.active { display: block; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .badge-present { background: #c6f6d5; color: #22543d; }
    .badge-absent { background: #fed7d7; color: #742a2a; }
    .badge-leave { background: #feebc8; color: #7b341e; }
    
    .notice-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .notice-item:last-child { border-bottom: none; }
    .notice-title { font-weight: 600; margin-bottom: 4px; }
    .notice-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
    .notice-body { font-size: 0.9rem; line-height: 1.4; white-space: pre-line; }

    .table-container { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; color: var(--text); }
  </style>
</head>
<body>

<div class="container">
  <!-- Login Screen -->
  <div id="loginCard" class="card">
    <h1>Student Portal</h1>
    <p class="subtitle">Access your attendance, homework, and exam marks</p>
    
    <div id="loginError" class="error-msg"></div>

    <div class="form-group">
      <label for="sectionSelect">Class / Section</label>
      <select id="sectionSelect">
        <option value="">Loading sections...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="rollInput">Roll Number</label>
      <input type="number" id="rollInput" placeholder="e.g. 101" min="1">
    </div>

    <div class="form-group">
      <label for="phoneInput">Guardian Mobile Number</label>
      <input type="tel" id="phoneInput" placeholder="e.g. 01700000000">
    </div>

    <button id="loginBtn" class="btn" onclick="doLogin()">View Details</button>
    <div id="loginLoading" class="loading">Verifying credentials...</div>
  </div>

  <!-- Student Dashboard Screen -->
  <div id="dashboardCard" class="card" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div>
        <h2 id="studentName" style="font-size: 1.2rem; color: var(--primary);">Student Name</h2>
        <span id="studentMeta" style="font-size: 0.8rem; color: var(--text-muted);">Section • Roll</span>
      </div>
      <button onclick="logout()" style="background: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">Logout</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('notices')">Notice / HW</button>
      <button class="tab-btn" onclick="switchTab('attendance')">Attendance</button>
      <button class="tab-btn" onclick="switchTab('marks')">Marks</button>
    </div>

    <!-- Notices Pane -->
    <div id="tab-notices" class="content-pane active">
      <div id="noticesList">Loading notices...</div>
    </div>

    <!-- Attendance Pane -->
    <div id="tab-attendance" class="content-pane">
      <div id="attendanceStats" style="margin-bottom: 12px; font-size: 0.9rem;"></div>
      <div class="table-container">
        <table id="attendanceTable">
          <thead>
            <tr><th>Month</th><th>Attendance Record</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Marks Pane -->
    <div id="tab-marks" class="content-pane">
      <div id="marksList">Loading exam marks...</div>
    </div>
  </div>
</div>

<script>
  // PASTE YOUR DEPLOYED WEB APP URL (/exec) HERE:
  const API = "https://script.google.com/macros/s/AKfycbwdFsWvA6_mPex6HLqt_8t0YlmE6sVKF04gO1l9il2LsmlzJa8H4qxUehR6-Aus5enf/exec";

  let session = { s: "", r: 0, tk: "", name: "" };

  window.onload = function() {
    loadSections();
  };

  async function apiCall(params, postData = null) {
    let url = API;
    if (params) {
      const q = new URLSearchParams(params).toString();
      url += (url.includes('?') ? '&' : '?') + q;
    }
    const opts = {};
    if (postData) {
      opts.method = 'POST';
      opts.body = JSON.stringify(postData);
    }
    const res = await fetch(url, opts);
    return await res.json();
  }

  async function loadSections() {
    try {
      const data = await apiCall({ action: 'sections' });
      const sel = document.getElementById('sectionSelect');
      sel.innerHTML = '';
      if (data.ok && data.sections.length > 0) {
        data.sections.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          sel.appendChild(opt);
        });
      } else {
        sel.innerHTML = '<option value="">No sections found</option>';
      }
    } catch (e) {
      document.getElementById('sectionSelect').innerHTML = '<option value="">Failed to load sections</option>';
    }
  }

  async function doLogin() {
    const s = document.getElementById('sectionSelect').value;
    const r = document.getElementById('rollInput').value;
    const phone = document.getElementById('phoneInput').value;
    const errBox = document.getElementById('loginError');
    const loading = document.getElementById('loginLoading');
    const btn = document.getElementById('loginBtn');

    errBox.style.display = 'none';
    if (!s || !r || !phone) {
      errBox.textContent = 'Please fill in class, roll number, and mobile number.';
      errBox.style.display = 'block';
      return;
    }

    loading.style.display = 'block';
    btn.disabled = true;

    try {
      const res = await apiCall(null, { action: 'slogin', s: s, r: Number(r), phone: phone });
      if (res.ok) {
        session = { s: s, r: Number(r), tk: res.tk, name: res.student.name };
        document.getElementById('studentName').textContent = res.student.name;
        document.getElementById('studentMeta').textContent = `Section: ${s} | Roll: ${r}`;
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('dashboardCard').style.display = 'block';
        loadDashboard();
      } else {
        errBox.textContent = res.error || 'Login failed. Please check your details.';
        errBox.style.display = 'block';
      }
    } catch (e) {
      errBox.textContent = 'Network error or server unavailable. Please try again.';
      errBox.style.display = 'block';
    } finally {
      loading.style.display = 'none';
      btn.disabled = false;
    }
  }

  function logout() {
    session = { s: "", r: 0, tk: "", name: "" };
    document.getElementById('dashboardCard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('rollInput').value = '';
    document.getElementById('phoneInput').value = '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.content-pane').forEach(p => p.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  async function loadDashboard() {
    loadNotices();
    loadAttendance();
    loadMarks();
  }

  async function loadNotices() {
    const list = document.getElementById('noticesList');
    list.innerHTML = 'Loading notices...';
    try {
      const res = await apiCall({ action: 'feed', s: session.s, r: session.r, tk: session.tk });
      if (res.ok && res.items.length > 0) {
        list.innerHTML = res.items.map(n => `
          <div class="notice-item">
            <div class="notice-title">${escapeHtml(n.title)} <span class="badge ${n.kind === 'HOMEWORK' ? 'badge-leave' : 'badge-present'}">${escapeHtml(n.kind)}</span></div>
            <div class="notice-meta">${n.subject ? '<b>' + escapeHtml(n.subject) + '</b> • ' : ''}Posted by ${escapeHtml(n.author)} (${n.created.slice(0, 10)}) ${n.due ? '• Due: ' + n.due : ''}</div>
            <div class="notice-body">${escapeHtml(n.body)}</div>
          </div>
        `).join('');
      } else {
        list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No notices or homework posted yet.</p>';
      }
    } catch (e) {
      list.innerHTML = '<p style="color: var(--danger);">Failed to load notices.</p>';
    }
  }

  async function loadAttendance() {
    const tbody = document.querySelector('#attendanceTable tbody');
    tbody.innerHTML = '<tr><td colspan="2">Loading attendance...</td></tr>';
    try {
      const res = await apiCall({ action: 'attendanceMine', s: session.s, r: session.r, tk: session.tk });
      if (res.ok && res.months && res.months.length > 0) {
        tbody.innerHTML = res.months.map(m => `
          <tr>
            <td><strong>${m.month}</strong></td>
            <td style="letter-spacing: 2px; font-family: monospace;">${escapeHtml(m.marks)}</td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="2" style="color: var(--text-muted);">No attendance records found.</td></tr>';
      }
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="2" style="color: var(--danger);">Failed to load attendance.</td></tr>';
    }
  }

  async function loadMarks() {
    const marksDiv = document.getElementById('marksList');
    marksDiv.innerHTML = 'Loading marks...';
    try {
      const res = await apiCall({ action: 'marksMine', s: session.s, r: session.r, tk: session.tk });
      if (res.ok && res.marks && res.marks.length > 0) {
        const groups = {};
        res.marks.forEach(m => {
          if (!groups[m.exam]) groups[m.exam] = [];
          groups[m.exam].push(m);
        });

        let html = '';
        for (const [examName, items] of Object.entries(groups)) {
          html += `<h4 style="margin: 12px 0 6px; color: var(--primary);">${escapeHtml(examName)}</h4>`;
          html += '<div class="table-container"><table><thead><tr><th>Subject</th><th>Breakdown</th><th>Total</th></tr></thead><tbody>';
          items.forEach(item => {
            const partsStr = Object.entries(item.parts || {}).map(([k, v]) => `${k}: ${v}`).join(', ') || '-';
            html += `<tr><td><strong>${escapeHtml(item.subject)}</strong></td><td>${escapeHtml(partsStr)}</td><td><strong>${item.total}</strong></td></tr>`;
          });
          html += '</tbody></table></div>';
        }
        marksDiv.innerHTML = html;
      } else {
        marksDiv.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No exam marks published yet.</p>';
      }
    } catch (e) {
      marksDiv.innerHTML = '<p style="color: var(--danger);">Failed to load marks.</p>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
    });
  }
</script>

</body>
</html>
